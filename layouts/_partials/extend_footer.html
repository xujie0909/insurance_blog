<style>pre.mermaid{background:transparent;border:none;padding:0;font-family:inherit;text-align:center;overflow:visible}</style>
<script>
  (function() {
    if (document.querySelector('.mermaid')) {
      const theme = document.documentElement.dataset.theme === 'dark' ? 'dark' : 'default';
      import('https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.esm.min.mjs').then(({ default: mermaid }) => {
        mermaid.initialize({ startOnLoad: true, theme: theme });
        document.getElementById('theme-toggle')?.addEventListener('click', () => {
          setTimeout(() => {
            const isDark = document.documentElement.dataset.theme === 'dark';
            mermaid.initialize({ startOnLoad: false, theme: isDark ? 'dark' : 'default' });
            document.querySelectorAll('.mermaid').forEach(el => {
              const src = el.getAttribute('data-src') || el.textContent.trim();
              el.setAttribute('data-src', src);
              el.removeAttribute('data-processed');
              el.innerHTML = src;
            });
            mermaid.run({ querySelector: '.mermaid' });
          }, 50);
        });
      });
    }
  })();
</script>
