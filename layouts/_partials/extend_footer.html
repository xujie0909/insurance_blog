<style>
pre.mermaid {
  background: transparent;
  border: none;
  padding: 1.5em 0;
  margin: 1.5em 0;
  font-family: inherit;
  text-align: center;
  overflow: visible;
}
pre.mermaid svg {
  max-width: 100%;
  height: auto;
  border-radius: var(--radius);
}
</style>
<script>
(function () {
  if (!document.querySelector('.mermaid')) return;

  function themeVars(isDark) {
    return isDark ? {
      primaryColor: '#2e2e33',
      primaryTextColor: '#c4c4c5',
      primaryBorderColor: '#414244',
      lineColor: '#9b9c9d',
      background: '#1d1e20',
      mainBkg: '#2e2e33',
      clusterBkg: '#37383e',
      edgeLabelBackground: '#2e2e33',
      nodeTextColor: '#c4c4c5',
      fontFamily: 'inherit',
    } : {
      primaryColor: '#f0f0f0',
      primaryTextColor: '#1e1e1e',
      primaryBorderColor: '#d6d6d6',
      lineColor: '#6c6c6c',
      background: '#ffffff',
      mainBkg: '#f5f5f5',
      clusterBkg: '#eeeeee',
      edgeLabelBackground: '#ffffff',
      nodeTextColor: '#1e1e1e',
      fontFamily: 'inherit',
    };
  }

  function renderMermaid(mermaid) {
    const isDark = document.documentElement.dataset.theme === 'dark';
    mermaid.initialize({
      startOnLoad: false,
      theme: 'base',
      themeVariables: themeVars(isDark),
      flowchart: { curve: 'basis', padding: 20 },
      mindmap: { padding: 16 },
    });
    mermaid.run({ querySelector: '.mermaid' });
  }

  import('https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.esm.min.mjs')
    .then(({ default: mermaid }) => {
      renderMermaid(mermaid);

      document.getElementById('theme-toggle')?.addEventListener('click', () => {
        setTimeout(() => {
          document.querySelectorAll('.mermaid').forEach(el => {
            if (!el.getAttribute('data-src')) {
              el.setAttribute('data-src', el.textContent.trim());
            }
            el.removeAttribute('data-processed');
            el.innerHTML = el.getAttribute('data-src');
          });
          renderMermaid(mermaid);
        }, 60);
      });
    });
})();
</script>
